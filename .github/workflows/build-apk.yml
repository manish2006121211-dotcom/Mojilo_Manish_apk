name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check project
        run: |
          echo "Repository files:"
          ls -la
          echo "Mojilo folder:"
          ls -la mojilo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: mojilo/package-lock.json

      - name: Install dependencies
        working-directory: mojilo
        run: npm ci

      - name: Build web app
        working-directory: mojilo
        run: npm run build

      - name: Install Capacitor
        working-directory: mojilo
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        working-directory: mojilo
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "Mojilo Manish" "com.mojilomanish.app" --web-dir=dist
          fi

      - name: Add Android platform
        working-directory: mojilo
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        working-directory: mojilo
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check Java
        run: |
          java -version
          javac -version

      - name: Build APK
        working-directory: mojilo/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mojilo-Manish-APK
          path: mojilo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
